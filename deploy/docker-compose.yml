version: "3.9"

name: dailygrowth
networks:
  appnet:

volumes:
  db_data:

services:
  db:
    image: mysql:8.0
    container_name: mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - db_data:/var/lib/mysql
    networks: [ appnet ]

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    command: ["redis-server","--requirepass","${REDIS_PASSWORD}"]
    networks: [ appnet ]

  backend:
    # CI/CD에서 푸시되는 이미지 태그를 사용 (release-latest or sha-xxxxxxx)
    image: ghcr.io/<OWNER>/<REPO>-backend:${BACK_TAG:-release-latest}
    container_name: backend
    restart: unless-stopped
    depends_on:
      - db
      - redis
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/${MYSQL_DATABASE}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=utf8
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: org.hibernate.dialect.MySQL8Dialect
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}
      SERVER_FORWARD_HEADERS_STRATEGY: framework
    expose:
      - "8080"   # 외부 바인딩 불필요. nginx가 프록시
    networks: [ appnet ]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10

  nginx:
    # 프론트 정적 + 리버스 프록시를 포함한 단일 nginx 이미지 (CI/CD에서 빌드/푸시)
    image: ghcr.io/<OWNER>/<REPO>-frontend:${FRONT_TAG:-release-latest}
    container_name: nginx
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
    networks: [ appnet ]
