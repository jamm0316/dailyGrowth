version: "3.9"
name: dailyGrowth
services:
  backend:
    image: ghcr.io/<OWNER>/<REPO>-backend:${BACK_TAG:-release-latest}
    restart: unless-stopped
    env_file: .env.backend
    ports:
      - "8080:8080"  # 내부 참조용, 외부는 nginx가 프록시
    networks: [ app ]

  frontend:
    image: ghcr.io/<OWNER>/<REPO>-frontend:${FRONT_TAG:-release-latest}
    restart: unless-stopped
    networks: [ app ]

  nginx:
    image: nginx:1.27-alpine
    depends_on: [ backend, frontend ]
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
      - "443:443"   # (옵션) 자체 TLS 종료 시
    networks: [ app ]

networks:
  app: {}
