name: Frontend CD

on:
  push:
    branches: [ "release", "release/*" ]
    paths:
      - "frontend/**"
      - "deploy/nginx.conf"
      - ".github/workflows/frontend-cd.yml"
  workflow_dispatch:

concurrency:
  group: prod-deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_FRONTEND: ghcr.io/${{ github.repository_owner }}/dialygrowth-frontend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set tags
        id: tags
        run: |
          echo "SHA_TAG=sha-${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
          echo "REL_TAG=release-latest" >> $GITHUB_OUTPUT

      # 컨텍스트=레포 루트, Dockerfile=frontend/Dockerfile
      # (deploy/nginx.conf와 frontend/dist 둘 다 COPY 가능)
      - name: Build & Push frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_FRONTEND }}:${{ steps.tags.outputs.SHA_TAG }}
            ${{ env.IMAGE_FRONTEND }}:${{ steps.tags.outputs.REL_TAG }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH (frontend only)
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          script: |
            set -e
            cd ~/app/deploy

            echo ${{ secrets.GHCR_TOKEN }} | docker login ghcr.io -u ${{ secrets.GHCR_USER }} --password-stdin

            export FRONT_TAG="${{ github.event.inputs.frontend_tag || 'release-latest' }}"
            export BACK_TAG="${BACK_TAG:-release-latest}"

            docker compose pull nginx
            docker compose up -d nginx
            docker image prune -af --filter "until=168h"
