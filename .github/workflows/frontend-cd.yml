name: Frontend CD

on:
  push:
    branches: [ "release", "release/*" ]
    paths:
      - "frontend/**"
      - "deploy/**"
      - ".github/workflows/frontend-cd.yml"
  workflow_dispatch:

concurrency:
  group: prod-deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_FRONTEND: ghcr.io/${{ github.repository }}-frontend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: frontend/package-lock.json }

      - name: Build
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag set
        id: t
        run: |
          echo "sha=sha-${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
          echo "rel=release-latest" >> $GITHUB_OUTPUT

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_FRONTEND }}:${{ steps.t.outputs.sha }}
            ${{ env.IMAGE_FRONTEND }}:${{ steps.t.outputs.rel }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: SSH deploy (frontend only)
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          script: |
            set -e
            cd ~/app/deploy
            echo ${{ secrets.GHCR_TOKEN }} | docker login ghcr.io -u ${{ secrets.GHCR_USER }} --password-stdin
            export FRONT_TAG=release-latest
            export BACK_TAG=${BACK_TAG:-release-latest}
            docker compose pull frontend
            docker compose up -d frontend
            docker image prune -af --filter "until=168h"
