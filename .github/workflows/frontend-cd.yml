name: Frontend CD

on:
  push:
    branches: [ "release", "release/*" ]
    paths:
      - "frontend/**"
      - "deploy/nginx.conf"
      - ".github/workflows/frontend-cd.yml"
  workflow_dispatch:

concurrency:
  group: prod-deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_FRONTEND: ghcr.io/${{ github.repository_owner }}/dialygrowth-frontend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set tags
        id: tags
        run: |
          echo "SHA_TAG=sha-${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
          echo "REL_TAG=release-latest" >> $GITHUB_OUTPUT

      # 컨텍스트=레포 루트, Dockerfile=frontend/Dockerfile
      # (deploy/nginx.conf와 frontend/dist 둘 다 COPY 가능)
      - name: Build & Push frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_FRONTEND }}:${{ steps.tags.outputs.SHA_TAG }}
            ${{ env.IMAGE_FRONTEND }}:${{ steps.tags.outputs.REL_TAG }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
  
      # InstanceId 직접 지정
      - name: Deploy via SSM
        run: |
          aws ssm send-command \
            --targets "Key=instanceIds,Values=i-09b5fe621a2878110" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy frontend (nginx)" \
            --parameters 'commands=[
              "set -e",
              "cd ~/app/deploy",
              "echo ${{ secrets.GHCR_TOKEN }} | docker login ghcr.io -u ${{ secrets.GHCR_USER }} --password-stdin",
              "docker compose pull nginx",
              "docker compose up -d --no-deps --pull=always nginx",
              "docker image prune -af",
              "docker builder prune -af"
            ]'
