name: Backend CD

on:
  push:
    branches: [ "release", "release/*" ]
    paths:
      - "backend/**"
      - "deploy/**"
      - ".github/workflows/backend-cd.yml"
  workflow_dispatch:

concurrency:
  group: prod-deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  REPO_NAME: ${{ github.repository }}
  IMAGE_BACKEND: ghcr.io/${{ github.repository_owner }}/dailygrowth-backend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # (옵션) 최소 테스트
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
      - name: Backend unit tests
        working-directory: backend
        run: ./gradlew test --no-daemon

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set tags
        id: tags
        run: |
          echo "SHA_TAG=sha-${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
          echo "REL_TAG=release-latest" >> $GITHUB_OUTPUT

      # 컨텍스트=backend, Dockerfile=backend/Dockerfile (멀티스테이지)
      - name: Build & Push backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_BACKEND }}:${{ steps.tags.outputs.SHA_TAG }}
            ${{ env.IMAGE_BACKEND }}:${{ steps.tags.outputs.REL_TAG }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH (backend only)
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          script: |
            set -e
            cd ~/app/deploy

            # GHCR 로그인
            echo ${{ secrets.GHCR_TOKEN }} | docker login ghcr.io -u ${{ secrets.GHCR_USER }} --password-stdin

            # 태그 지정(기본: release-latest), 필요시 workflow_dispatch로 sha-xxxxxxx 입력해 롤백 가능
            export BACK_TAG="${{ github.event.inputs.backend_tag || 'release-latest' }}"
            export FRONT_TAG="${FRONT_TAG:-release-latest}"

            docker compose pull backend
            docker compose up -d backend
            docker image prune -af --filter "until=168h"
