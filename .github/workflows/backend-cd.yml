name: Backend CD

on:
  push:
    branches: [ "release", "release/*" ]
    paths:
      - "backend/**"
      - "deploy/**"
      - ".github/workflows/backend-cd.yml"
  workflow_dispatch:

concurrency:
  group: prod-deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_BACKEND: ghcr.io/jamm0316/dailygrowth-backend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # (옵션) 최소 테스트
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
      - name: Backend unit tests
        working-directory: backend
        run: ./gradlew test --no-daemon

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set tags
        id: tags
        run: |
          echo "SHA_TAG=sha-${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
          echo "REL_TAG=release-latest" >> $GITHUB_OUTPUT

      # 컨텍스트=backend, Dockerfile=backend/Dockerfile (멀티스테이지)
      - name: Build & Push backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_BACKEND }}:${{ steps.tags.outputs.SHA_TAG }}
            ${{ env.IMAGE_BACKEND }}:${{ steps.tags.outputs.REL_TAG }}
  
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1   # EC2 리전 맞추기 (현재 us-east-1)
  
      - name: Deploy via SSM
        run: |
          aws ssm send-command \
            --targets "Key=instanceIds,Values=i-09b5fe621a2878110" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy backend" \
            --parameters 'commands=[
              "cd ~/app/deploy",
              "echo ${{ secrets.GHCR_TOKEN }} | docker login ghcr.io -u ${{ secrets.GHCR_USER }} --password-stdin",
              "docker compose pull backend",
              "docker compose up -d backend",
              "docker image prune -af",
              "docker builder prune -af"
            ]'
