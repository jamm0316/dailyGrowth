name: Backend CD

on:
  push:
    branches: [ "release", "release/*" ]
    paths:
      - "backend/**"
      - "deploy/**"
      - ".github/workflows/backend-cd.yml"
  workflow_dispatch:

concurrency:
  group: prod-deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_BACKEND: ghcr.io/${{ github.repository }}-backend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v4

      # (선택) CI와 분리 유지. 여기서도 간단 테스트 한 번 돌리려면 아래 3스텝 유지
      - uses: actions/setup-java@v4
        with: { java-version: "17", distribution: "temurin" }
      - name: Gradle test
        working-directory: backend
        run: ./gradlew test --no-daemon

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag set
        id: t
        run: |
          echo "sha=sha-${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
          echo "rel=release-latest" >> $GITHUB_OUTPUT

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_BACKEND }}:${{ steps.t.outputs.sha }}
            ${{ env.IMAGE_BACKEND }}:${{ steps.t.outputs.rel }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: SSH deploy (backend only)
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          script: |
            set -e
            cd ~/app/deploy
            echo ${{ secrets.GHCR_TOKEN }} | docker login ghcr.io -u ${{ secrets.GHCR_USER }} --password-stdin
            export BACK_TAG=release-latest
            export FRONT_TAG=${FRONT_TAG:-release-latest}
            docker compose pull backend
            docker compose up -d backend
            docker image prune -af --filter "until=168h"
